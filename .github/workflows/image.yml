name: Image

# Builds the deployable image and pushes it to Harbor. Split out from ci.yml so a red
# test suite never produces a pushed tag: this waits for CI to go green on the same SHA.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Only when CI passed. A failed or cancelled run must not ship an image.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
      REPO: sales-cadence/app

    steps:
      - uses: actions/checkout@v4
        with:
          # Build the exact commit CI verified, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Type checking already ran in CI; repeating it here only burns build memory.
          build-args: |
            SKIP_TYPE_CHECK=true
            NEXT_BUILD_CPUS=2
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}:prod-v1.0.0-${{ steps.sha.outputs.short }}
            ${{ env.REGISTRY }}/${{ env.REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Pushed"
            echo ""
            echo '```'
            echo "${{ env.REGISTRY }}/${{ env.REPO }}:prod-v1.0.0-${{ steps.sha.outputs.short }}"
            echo '```'
            echo ""
            echo "Deploy with:"
            echo '```bash'
            echo "nomad job run -var=\"image_tag=prod-v1.0.0-${{ steps.sha.outputs.short }}\" \\"
            echo "  -var=\"harbor_password=<harbor>\" ~/cadence.nomad.hcl"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
