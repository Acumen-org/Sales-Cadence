# ---------------------------------------------------------------------------
# CI for Sales-Cadence.
#
#   lint / test / e2e  — on GitHub's runners, in parallel. The gate.
#   build              — self-hosted: Harbor is not routable from outside, so a
#                        hosted runner can only sit on docker login until it
#                        times out.
#   deploy             — self-hosted, and only after the suite is green. The
#                        jobspec sets auto_revert, which is what makes an
#                        unattended deploy safe: a release that cannot pass its
#                        health check rolls back instead of staying up broken.
#   notify             — the shared Acumen-org workflow, to Teams and Mattermost.
#
# Postgres 18 matches production (db-acumen), and Prisma is version-sensitive
# enough that pinning it here keeps CI honest about migrations.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.9"
  ENVIRONMENT: "prod"
  VERSION: "1.0.0"
  REGISTRY: h4rb0r.pmx.acumen-strategy.com
  DOCKER_IMAGE: h4rb0r.pmx.acumen-strategy.com/sales-cadence/app

jobs:
  # -------------------------------------------------------------------- lint
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma's generated client is a typecheck dependency: tsc fails without it.
      - run: pnpm db:generate

      - name: eslint
        run: pnpm lint

      - name: tsc --noEmit
        run: pnpm typecheck

  # --------------------------------------------------------------------- test
  test:
    name: vitest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cadence
          POSTGRES_PASSWORD: cadence
          POSTGRES_DB: cadence_test
        ports:
          - 5432:5432
        # Without the health check the first migration races the server's boot.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 127.0.0.1, not localhost: Node resolves localhost to ::1 first and the
      # service container only listens on IPv4.
      DATABASE_URL: postgresql://cadence:cadence@127.0.0.1:5432/cadence_test
      SESSION_SECRET: ci-session-secret-not-a-real-one
      TWENTY_MODE: mock

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: apply migrations
        run: pnpm db:migrate

      - name: vitest
        run: pnpm test

  # ---------------------------------------------------------------------- e2e
  e2e:
    name: playwright
    runs-on: ubuntu-latest
    # A build plus a browser run costs minutes; not worth spending on a tree
    # that does not typecheck.
    needs: [lint]

    env:
      SESSION_SECRET: ci-session-secret-not-a-real-one
      TWENTY_MODE: mock

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: install browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: playwright
        run: pnpm test:e2e

      # And again as a brand-new deployment: one admin, the default sequence,
      # nothing worked yet.
      - name: fresh-install check
        run: pnpm test:fresh

      # The trace is the only way to read a failure that does not reproduce
      # locally, so keep it when the run went red.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # -------------------------------------------------------------------- build
  build:
    name: build + push image
    runs-on: self-hosted
    needs: [lint, test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    outputs:
      IMAGE_TAG: ${{ steps.export_tag.outputs.IMAGE_TAG }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Generate IMAGE_TAG
        id: export_tag
        run: |
          IMAGE_TAG="${{ env.ENVIRONMENT }}-v${{ env.VERSION }}-${GITHUB_SHA::7}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USER }}
          password: ${{ secrets.HARBOR_TOKEN }}

      # Types were already checked in `lint`; repeating them inside the build
      # only raises its memory ceiling on a 4GB runner.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            SKIP_TYPE_CHECK=true
            NEXT_BUILD_CPUS=2
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

  # ------------------------------------------------------------------- deploy
  deploy:
    name: deploy to Nomad
    runs-on: self-hosted
    needs: build

    env:
      IMAGE_TAG: ${{ needs.build.outputs.IMAGE_TAG }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Nomad
        uses: hashicorp/setup-nomad@main
        with:
          version: latest

      # The web task applies Prisma migrations on start, so a release carrying
      # one takes longer than a plain restart; the jobspec's deadlines allow for
      # that, and auto_revert catches the case where it never comes up.
      - name: Deploy to Nomad
        env:
          NOMAD_ADDR: ${{ vars.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: |
          nomad job run \
            -var="image_tag=${IMAGE_TAG}" \
            -var="harbor_username=${{ secrets.HARBOR_USER }}" \
            -var="harbor_password=${{ secrets.HARBOR_TOKEN }}" \
            nomad/cadence.hcl

  # ------------------------------------------------------------------- notify
  notify:
    needs: [build, deploy]
    if: always()
    uses: Acumen-org/deploy-notify/.github/workflows/notify.yml@main
    with:
      app_name: "Sales Cadence"
      environment: "prod"
      status: ${{ needs.deploy.result }}
      version: ${{ needs.build.outputs.IMAGE_TAG }}
      actor: ${{ github.actor }}
      run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    secrets:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
