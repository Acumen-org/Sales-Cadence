# ---------------------------------------------------------------------------
# CI for Sales-Cadence.
#
#   lint / test / e2e  — in parallel. The gate. On a pull request (Dependabot's
#                        too) they run on GitHub's hosted runners, never on the
#                        self-hosted one: unreviewed code must not run inside the
#                        network that reaches Harbor and Nomad (T05). Pushes to
#                        main run them on the self-hosted runner.
#   build              — self-hosted: Harbor is not routable from outside, so a
#                        hosted runner can only sit on docker login until it
#                        times out.
#   deploy             — self-hosted, and only after the suite is green. The
#                        jobspec sets auto_revert, which is what makes an
#                        unattended deploy safe: a release that cannot pass its
#                        health check rolls back instead of staying up broken.
#   notify             — on main, posts the outcome to the incoming webhook in the
#                        secret DEPLOY_NOTIFY_WEBHOOK (Teams or Mattermost, both
#                        take {"text": ...}); without that secret it only warns (T13).
#
# Postgres 18 matches production (db-acumen), and Prisma is version-sensitive
# enough that pinning it here keeps CI honest about migrations.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# T15: a newer push cancels an older pull-request run, never a run on main: its deploy may be
# applying a migration. Runs on main queue behind each other instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# T50: nothing here needs an identity token.
permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.9"
  ENVIRONMENT: "prod"
  VERSION: "1.0.0"
  REGISTRY: h4rb0r.pmx.acumen-strategy.com
  DOCKER_IMAGE: h4rb0r.pmx.acumen-strategy.com/sales-cadence/app

jobs:
  # -------------------------------------------------------------------- lint
  lint:
    name: lint + typecheck
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma's generated client is a typecheck dependency: tsc fails without it.
      - run: pnpm db:generate

      - name: eslint
        run: pnpm lint

      - name: tsc --noEmit
        run: pnpm typecheck

  # --------------------------------------------------------------------- test
  test:
    name: vitest
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'self-hosted' }}

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cadence
          POSTGRES_PASSWORD: cadence
          POSTGRES_DB: cadence_test
        # T51: a free host port chosen by Docker, so two runs on one machine
        # never collide on 5432.
        ports:
          - 5432
        # Without the health check the first migration races the server's boot.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TWENTY_MODE: mock

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      # The service's Postgres 18, as in production. 127.0.0.1, not localhost:
      # Node resolves localhost to ::1 first and the service only listens on IPv4.
      - name: apply migrations
        env:
          DATABASE_URL: postgresql://cadence:cadence@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/cadence_test
        run: pnpm db:migrate

      # vitest starts its own embedded Postgres (tests/setup/global-setup.ts).
      - name: vitest
        run: pnpm test

  # ---------------------------------------------------------------------- e2e
  e2e:
    name: playwright
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'self-hosted' }}
    # A build plus a browser run costs minutes; not worth spending on a tree
    # that does not typecheck.
    needs: [lint]

    env:
      TWENTY_MODE: mock

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: install browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: playwright
        run: pnpm test:e2e

      # And again as a brand-new deployment: one admin, the default sequence,
      # nothing worked yet.
      - name: fresh-install check
        run: pnpm test:fresh

      # The trace is the only way to read a failure that does not reproduce
      # locally, so keep it when the run went red.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # -------------------------------------------------------------------- build
  build:
    name: build + push image
    runs-on: self-hosted
    needs: [lint, test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    outputs:
      IMAGE_TAG: ${{ steps.export_tag.outputs.IMAGE_TAG }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Generate IMAGE_TAG
        id: export_tag
        run: |
          IMAGE_TAG="${{ env.ENVIRONMENT }}-v${{ env.VERSION }}-${GITHUB_SHA::7}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Types were already checked in `lint`; repeating them inside the build
      # only raises its memory ceiling on a 4GB runner.
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            SKIP_TYPE_CHECK=true
            NEXT_BUILD_CPUS=2
          # T52: only the release's own tag; no moving `latest` for anything to pull by mistake.
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_IMAGE }}:buildcache,mode=max

  # ------------------------------------------------------------------- deploy
  deploy:
    name: deploy to Nomad
    runs-on: self-hosted
    needs: build
    # T15: one production deploy at a time, and never cancelled part-way.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    env:
      IMAGE_TAG: ${{ needs.build.outputs.IMAGE_TAG }}

    steps:
      - uses: actions/checkout@v4

      # T16 (needs-infra): pin this action to a commit SHA and `version` to the
      # cluster's Nomad release (DEPLOY.md, "CI pins").
      - name: Setup Nomad
        uses: hashicorp/setup-nomad@main
        with:
          version: latest

      # The web task applies Prisma migrations on start, so a release carrying
      # one takes longer than a plain restart; the jobspec's deadlines allow for
      # that, and auto_revert catches the case where it never comes up.
      - name: Deploy to Nomad
        env:
          NOMAD_ADDR: ${{ secrets.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
        run: |
          nomad job run \
            -var="image_tag=${IMAGE_TAG}" \
            -var="harbor_username=${{ secrets.HARBOR_USERNAME }}" \
            -var="harbor_password=${{ secrets.HARBOR_PASSWORD }}" \
            nomad/cadence.hcl

  # ------------------------------------------------------------------- notify
  # T13: tells people when a run on main fails or deploys. Needs the secret
  # DEPLOY_NOTIFY_WEBHOOK (an incoming webhook URL); without it this only warns.
  # It runs after the deploy and never fails the run.
  notify:
    name: notify
    runs-on: self-hosted
    needs: [lint, test, e2e, build, deploy]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: post the outcome
        env:
          WEBHOOK: ${{ secrets.DEPLOY_NOTIFY_WEBHOOK }}
          RESULT: ${{ contains(needs.*.result, 'failure') && 'FAILED' || needs.deploy.result == 'success' && 'deployed' || needs.deploy.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          text="Cadence ${GITHUB_SHA::7} on main: ${RESULT}. ${RUN_URL}"
          if [ -z "$WEBHOOK" ]; then echo "::warning::DEPLOY_NOTIFY_WEBHOOK is not set, nobody was told: $text"; exit 0; fi
          curl -fsS -m 20 -H 'Content-Type: application/json' -d "{\"text\": \"$text\"}" "$WEBHOOK" || echo "::warning::the notification could not be sent"
