# ---------------------------------------------------------------------------
# CI for Sales-Cadence.
#
# Three verification jobs: lint/typecheck, unit tests, and browser tests.
# Image building and deployment are managed on the hosting server, outside this
# workflow. A successful run confirms checks, not that the live app was updated.
#
# Postgres 18 matches production (db-acumen). Prisma 6 is version-sensitive,
# so pinning the service image here keeps CI honest about migrations.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.9"

jobs:
  # -------------------------------------------------------------------------- lint
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma's generated client is a typecheck dependency: tsc fails without it.
      - run: pnpm db:generate

      - name: eslint
        run: pnpm lint

      - name: tsc --noEmit
        run: pnpm typecheck

  # -------------------------------------------------------------------------- unit tests
  test:
    name: vitest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cadence
          POSTGRES_PASSWORD: cadence
          POSTGRES_DB: cadence_test
        ports:
          - 5432:5432
        # Without the health check the first migration races the server's boot.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 127.0.0.1, not localhost: Node 20 resolves localhost to ::1 first and
      # the service container only listens on IPv4.
      DATABASE_URL: postgresql://cadence:cadence@127.0.0.1:5432/cadence_test
      SESSION_SECRET: ci-session-secret-not-a-real-one
      TWENTY_MODE: mock

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: apply migrations
        run: pnpm db:migrate

      - name: vitest
        run: pnpm test

  # -------------------------------------------------------------------------- e2e
  e2e:
    name: playwright
    runs-on: ubuntu-latest
    # A build plus a browser run costs minutes; no point spending them on a
    # tree that does not typecheck.
    needs: [lint]

    env:
      SESSION_SECRET: ci-session-secret-not-a-real-one
      TWENTY_MODE: mock

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: install browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: playwright
        run: pnpm test:e2e

      # And again as a brand-new deployment: one admin, the default sequence,
      # nothing worked yet.
      - name: fresh-install check
        run: pnpm test:fresh

      # The trace is the only way to read a failure that does not reproduce
      # locally, so keep it when (and only when) the run went red. The list
      # reporter writes traces, screenshots and error context under
      # test-results/; playwright-report/ only exists with the html reporter.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
