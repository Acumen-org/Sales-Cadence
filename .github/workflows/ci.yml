# ---------------------------------------------------------------------------
# CI for Sales-Cadence.
#
# Four jobs:
#   1. lint       — eslint + tsc --noEmit. Cheapest signal, runs first.
#   2. test       — vitest unit suite against a real Postgres 18 service.
#                   Prisma migrations run first so the tests hit the same
#                   schema production does.
#   3. e2e        — Playwright. Builds the app, so it is the slow one; kept
#                   separate from `test` to avoid blocking the fast feedback.
#   4. image      — builds and pushes to Harbor. main only, and only after
#                   the three above pass: a red suite must never ship a tag.
#
# Postgres 18 matches production (db-acumen). Prisma 6 is version-sensitive,
# so pinning the service image here keeps CI honest about migrations.
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.15.9"

jobs:
  # -------------------------------------------------------------------------- lint
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma's generated client is a typecheck dependency: tsc fails without it.
      - run: pnpm db:generate

      - name: eslint
        run: pnpm lint

      - name: tsc --noEmit
        run: pnpm typecheck

  # -------------------------------------------------------------------------- unit tests
  test:
    name: vitest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cadence
          POSTGRES_PASSWORD: cadence
          POSTGRES_DB: cadence_test
        ports:
          - 5432:5432
        # Without the health check the first migration races the server's boot.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # 127.0.0.1, not localhost: Node 20 resolves localhost to ::1 first and
      # the service container only listens on IPv4.
      DATABASE_URL: postgresql://cadence:cadence@127.0.0.1:5432/cadence_test
      SESSION_SECRET: ci-session-secret-not-a-real-one
      TWENTY_MODE: mock

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: apply migrations
        run: pnpm db:migrate

      - name: vitest
        run: pnpm test

  # -------------------------------------------------------------------------- e2e
  e2e:
    name: playwright
    runs-on: ubuntu-latest
    # A build plus a browser run costs minutes; no point spending them on a
    # tree that does not typecheck.
    needs: [lint]

    env:
      SESSION_SECRET: ci-session-secret-not-a-real-one
      TWENTY_MODE: mock

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate

      - name: install browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: playwright
        run: pnpm test:e2e

      # And again as a brand-new deployment: one admin, the default sequence,
      # nothing worked yet.
      - name: fresh-install check
        run: pnpm test:fresh

      # The trace is the only way to read a failure that does not reproduce
      # locally, so keep it when (and only when) the run went red. The list
      # reporter writes traces, screenshots and error context under
      # test-results/; playwright-report/ only exists with the html reporter.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # -------------------------------------------------------------------------- image
  image:
    name: build + push image
    runs-on: ubuntu-latest
    needs: [lint, test, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    env:
      REPO: sales-cadence/app

    steps:
      - uses: actions/checkout@v4

      - name: short sha
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Types were already checked in `lint`; repeating it here only
          # doubles the build's memory ceiling.
          build-args: |
            SKIP_TYPE_CHECK=true
            NEXT_BUILD_CPUS=2
          tags: |
            ${{ secrets.HARBOR_REGISTRY }}/${{ env.REPO }}:prod-v1.0.0-${{ steps.sha.outputs.short }}
            ${{ secrets.HARBOR_REGISTRY }}/${{ env.REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploying is deliberately manual: this app writes to the production
      # CRM, so a human decides when a tag goes live.
      - name: deploy command
        run: |
          {
            echo "### Pushed \`prod-v1.0.0-${{ steps.sha.outputs.short }}\`"
            echo ""
            echo '```bash'
            echo "nomad job run -var=\"image_tag=prod-v1.0.0-${{ steps.sha.outputs.short }}\" \\"
            echo "  -var=\"harbor_password=<harbor>\" ~/cadence.nomad.hcl"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
